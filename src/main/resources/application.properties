# Время жизни ссылки (в секундах). По умолчанию сутки.
link.ttl.seconds=86400
# Лимит переходов по умолчанию
link.default.max.clicks=100
# Длина короткого кода
link.shortcode.length=7
# Базовый префикс, отображаемый пользователю
link.base.url=clck.ru/
# Интервал автоочистки протухших ссылок (секунды)
cleanup.interval.seconds=60